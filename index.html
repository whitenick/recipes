<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nick's Kitchen</title>
  <meta name="description" content="A personal collection of recipes — tested, refined, and kept." />
  <meta property="og:title" content="Nick's Kitchen" />
  <meta property="og:description" content="A personal collection of recipes — tested, refined, and kept." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://whitenick.github.io/recipes/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?mobile-fix-1" />
</head>
<body>

  <!-- ══════════════════════ HEADER ══════════════════════ -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">

        <!-- Wordmark -->
        <a href="https://nickwhite.us" class="logo">
          <div class="logo-text">
            <span class="logo-title">Nick's <em>Kitchen</em></span>
            <span class="logo-divider"></span>
            <span class="logo-sub">Serapio Labs</span>
          </div>
        </a>

        <!-- Actions -->
        <div class="header-actions">
          <a href="https://nickwhite.us" class="header-home-link">Home</a>
          <a href="menus.html" class="header-home-link" id="mobileMenusLink">Menus</a>
          <a href="guides.html" class="header-home-link" id="mobileGuidesLink">Guides</a>
          <button class="btn-icon" id="groceryBtn" title="Grocery list" onclick="openGroceryPanel()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="m1 1 4 4h16l-2 9H7L5 5"></path>
            </svg>
            <span class="fav-count" id="groceryBadge"></span>
          </button>
          <button class="btn-icon" id="favoritesToggle" title="Saved recipes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <span class="fav-count" id="favCount"></span>
          </button>
          <button class="btn-icon" id="printBtn" title="Print recipe" style="display:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- ══════════════════════ MAIN ══════════════════════ -->
  <main>

    <!-- ── Recipe List View ── -->
    <div id="listView">

      <!-- Hero -->
      <section class="hero">
        <div class="container">

          <div class="hero-label">
            <span class="hero-label-dot"></span>
            The Collection
          </div>

          <h1 class="hero-title">The Kitchen</h1>

          <p class="hero-subtitle">Recipes collected, tested, and returned to.</p>

          <div class="search-wrap">
            <div class="search-box">
              <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input
                type="search"
                id="searchInput"
                placeholder="Search recipes, ingredients…"
                autocomplete="off"
                spellcheck="false"
              />
              <button class="search-clear" id="searchClear" style="display:none">✕</button>
            </div>
          </div>

        </div>
      </section>

      <!-- Recent Recipes -->
      <section class="featured-section" id="featuredSection" style="display:none">
        <div class="container">
          <div class="featured-header" id="featuredToggle" role="button" tabindex="0" aria-expanded="true" aria-controls="featuredContent">
            <div class="featured-header-top">
              <div class="featured-label">
                <span class="hero-label-dot"></span>
                Fresh
              </div>
              <button class="featured-collapse-btn" aria-label="Toggle Recent Recipes">
                <svg class="collapse-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </button>
            </div>
            <h2 class="featured-title" id="featuredTitle">Recent Recipes</h2>
            <p class="featured-subtitle" id="featuredSubtitle">Fresh from the collection</p>
          </div>
          <div class="featured-content" id="featuredContent">
            <div class="featured-grid" id="featuredGrid">
              <!-- Recent recipe cards injected here -->
            </div>
          </div>
        </div>
      </section>

      <!-- Filters -->
      <section class="filters-section">
        <div class="container">
          <div class="filters-row">
            <div class="filters-scroll">
              <button class="filter-chip active" data-category="">All</button>
              <!-- Dynamic chips injected here -->
            </div>
            <div class="view-toggle">
              <button class="view-btn active" id="gridViewBtn" title="Grid view">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                  <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                </svg>
              </button>
              <button class="view-btn" id="listViewBtn" title="List view">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="3" y="4" width="18" height="3"/><rect x="3" y="10" width="18" height="3"/>
                  <rect x="3" y="16" width="18" height="3"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="results-meta" id="resultsMeta"></div>
        </div>
      </section>

      <!-- Recipe Grid -->
      <section class="recipes-section">
        <div class="container">
          <div class="recipe-grid" id="recipeGrid">
            <!-- Recipe cards injected here -->
          </div>
          <div class="empty-state" id="emptyState" style="display:none">
            <div class="empty-icon">◌</div>
            <h3>Nothing found</h3>
            <p>Try a different term, or browse the full collection.</p>
            <button class="btn-primary" onclick="clearSearch()">Clear search</button>
          </div>
        </div>
      </section>

    </div>

    <!-- ── Recipe Detail View ── -->
    <div id="detailView" style="display:none">
      <div class="container">
        <button class="back-btn" id="backBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          All Recipes
        </button>
        <div class="recipe-detail" id="recipeDetail">
          <!-- Recipe content injected here -->
        </div>
      </div>
    </div>

  </main>

  <!-- ══════════════════════ FOOTER ══════════════════════ -->
  <footer class="site-footer">
    <div class="container">
      <p>Nick's Kitchen &nbsp;·&nbsp; <a href="https://serapiolabs.com">Serapio Labs</a></p>
    </div>
  </footer>

  <!-- Grocery List Panel -->
  <div class="grocery-overlay" id="groceryOverlay" onclick="closeGroceryPanel()"></div>
  <aside class="grocery-panel" id="groceryPanel">
    <div class="grocery-panel-header">
      <h2>🛒 Grocery List</h2>
      <div class="grocery-panel-actions">
        <button class="grocery-action-btn grocery-export-btn" onclick="exportGroceryList()" title="Copy to clipboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        </button>
        <button class="grocery-action-btn" onclick="printGroceryList()" title="Print list">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          Print
        </button>
        <button class="grocery-close-btn" onclick="closeGroceryPanel()" title="Close">×</button>
      </div>
    </div>
    <div class="grocery-panel-content" id="groceryContent">
      <!-- Content injected by JS -->
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="grocery.js"></script>
  <script src="app.js"></script>
</body>
</html>
